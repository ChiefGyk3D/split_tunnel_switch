# CodeQL, gitleaks, Semgrep and dependency review on pull requests. The jobs live
# in ChiefGyk3D/git-your-ship-together; this file only calls them.
# Static scans only: nothing in this repository is ever executed by CI.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:00 UTC, so new advisories surface between commits
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@9d6825dd4e0e4d524fca3733f416437bbd7851e1 # v1.31.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write   # the callee's Snyk and Scorecard jobs declare it; both are off here
    with:
      codeql-languages: actions
      pip-audit-requirements: ''   # no requirements file; nothing is installed
      egress-policy: block
